groups:
  - name: ai_agent_alerts
    rules:
      - alert: AgentHighErrorRate
        expr: >
          (sum(rate(http_requests_total{job="agent",route="/ask",status=~"5.."}[1m])) or vector(0))
          / clamp_min(sum(rate(http_requests_total{job="agent",route="/ask"}[1m])), 1e-9)
          > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Agent /ask 5xx error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 1m."

      - alert: AgentHighLatencyP95
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="agent",route="/ask"}[1m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Agent /ask p95 latency > 500ms"
          description: "p95 latency is {{ $value | humanizeDuration }} over the last 1m."

      - alert: AgentInstanceDown
        expr: up{job="agent"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Agent instance {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 30s."

      - alert: LLMCostBurnRateHigh
        expr: sum(rate(llm_cost_usd_total{job="agent"}[1m])) * 3600 > 15
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LLM cost burn rate > $15/hour"
          description: "Estimated LLM burn rate is ${{ $value | printf \"%.2f\" }}/hour."
